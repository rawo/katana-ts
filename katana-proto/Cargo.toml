[package]
name = "katana-proto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["midi"]
midi = ["dep:midir"]
testing = []
hardware-tests = ["midi"]

[dependencies]
thiserror = "2"
serde_json = { version = "1", features = ["preserve_order"] }
midir = { version = "0.10", optional = true }
