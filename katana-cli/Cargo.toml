[package]
name = "katana-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
katana-proto = { path = "../katana-proto" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
directories = "6"
ctrlc = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
serde_json = "1"
