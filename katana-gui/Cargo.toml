[package]
name = "katana-gui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
katana-proto = { path = "../katana-proto" }
eframe = "0.37"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
katana-proto = { path = "../katana-proto", features = ["testing"] }
egui_kittest = "0.37"
